name: FoundersOffice

options:
  bundleIdPrefix: com.manish
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FounderOfficePackage:
    path: .

targets:
  FoundersOfficeMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/OpenLoops
      - path: Apps/macOS/Assets.xcassets
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Apps/macOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.txt
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: FounderOfficePackage
        product: FounderOfficeCore
      - package: FounderOfficePackage
        product: FounderOfficeCloud
      - package: FounderOfficePackage
        product: FounderOfficeIdentity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manish.openloops
        PRODUCT_NAME: "Founder's Office"
        INFOPLIST_FILE: Apps/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/FoundersOfficeMac.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FOUNDER_OFFICE_AUTH_CALLBACK_SCHEME: founders-office-dev
        FOUNDER_OFFICE_SUPABASE_URL: ""
        FOUNDER_OFFICE_SUPABASE_PUBLISHABLE_KEY: ""
        FOUNDER_OFFICE_UPDATE_FEED_URL: ""
        FOUNDER_OFFICE_UPDATE_CHANNEL: ""
        FOUNDER_OFFICE_UPDATE_PUBLIC_KEY: ""
      configs:
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FOUNDER_OFFICE_DISTRIBUTION"
    scheme:
      gatherCoverageData: true
      testTargets:
        - FoundersOfficeMacUITests

  FoundersOfficeMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/macOSUITests
    dependencies:
      - target: FoundersOfficeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manish.openloops.uitests
        PRODUCT_NAME: "Founder's Office UI Tests"
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: FoundersOfficeMac

  FoundersOfficeiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/iOS
        excludes:
          - README.md
          - Resources/Info.plist
          - Resources/FoundersOfficeiOS.entitlements
      - path: Resources/Fonts/InstrumentSerif-Regular.ttf
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: FounderOfficePackage
        product: FounderOfficeCore
      - package: FounderOfficePackage
        product: FounderOfficeCloud
      - package: FounderOfficePackage
        product: FounderOfficeIdentity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manish.foundersoffice.ios
        PRODUCT_NAME: "Founder's Office"
        INFOPLIST_FILE: Apps/iOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Resources/FoundersOfficeiOS.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The approved production icon is tracked by the distribution P0.
        # Keep this empty so development and CI builds do not reference a
        # nonexistent AppIcon catalog.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FOUNDER_OFFICE_AUTH_CALLBACK_SCHEME: founders-office-dev
        FOUNDER_OFFICE_SUPABASE_URL: ""
        FOUNDER_OFFICE_SUPABASE_PUBLISHABLE_KEY: ""
    scheme:
      gatherCoverageData: true
