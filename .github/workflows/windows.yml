name: Founder's Office Windows

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "Apps/Windows/**"
      - "contracts/v1/**"
      - "Scripts/check-repository-safety.sh"
      - "Scripts/validate-windows-scaffold.py"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "Apps/Windows/**"
      - "contracts/v1/**"
      - "Scripts/check-repository-safety.sh"
      - "Scripts/validate-windows-scaffold.py"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founders-office-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Native Windows build and tests
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Apps/Windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: Apps/Windows/global.json
          cache: true
          cache-dependency-path: Apps/Windows/**/packages.lock.json

      - name: Enforce repository privacy boundary
        working-directory: .
        shell: bash
        run: Scripts/check-repository-safety.sh

      - name: Validate Windows structure and release boundaries
        working-directory: .
        run: |
          python Scripts/validate-windows-scaffold.py
          python -m unittest Apps.Windows.Scripts.test_verify_development_bundle

      - name: Restore locked dependencies
        run: dotnet restore .\FoundersOffice.Windows.slnx --locked-mode

      - name: Check default Windows PowerShell installer compatibility
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "This check requires Windows PowerShell 5.1." }
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "Distribution\Install-Development.ps1"), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) {
            foreach ($parseError in $parseErrors) {
              Write-Output ("Installer parse error: {0}, line {1}" -f $parseError.ErrorId, $parseError.Extent.StartLineNumber)
            }
            throw "The installer must parse in Windows PowerShell 5.1."
          }
          $functions = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq "Get-DevelopmentBundleRelativePath" }, $true))
          if ($functions.Count -ne 1) { throw "The installer path boundary is missing or ambiguous." }
          . ([scriptblock]::Create($functions[0].Extent.Text))
          $relative = Get-DevelopmentBundleRelativePath -BundleRoot "C:\synthetic-bundle" -FilePath "C:\synthetic-bundle\package.msix"
          if ($relative -ne "package.msix") { throw "The installer relative-path boundary failed." }
          $rejected = $false
          try { Get-DevelopmentBundleRelativePath -BundleRoot "C:\synthetic-bundle" -FilePath "C:\synthetic-bundle-other\package.msix" } catch { $rejected = $true }
          if (-not $rejected) { throw "The installer accepted a path outside the bundle." }

      - name: Test platform-neutral Windows core
        run: >-
          dotnet test
          .\tests\FoundersOffice.Core.Tests\FoundersOffice.Core.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"

      - name: Compile native WinUI 3 shell
        run: >-
          dotnet build
          .\src\FoundersOffice.App\FoundersOffice.App.csproj
          --configuration Release
          --no-restore
          -p:Platform=x64
          -p:AppxPackageSigningEnabled=false

      - name: Verify offline public-configuration preflight
        run: >-
          dotnet run
          --project .\tools\FoundersOffice.Acceptance\FoundersOffice.Acceptance.csproj
          --configuration Release
          --no-restore
          -- --configuration .\Configuration\ProductAuth.example.json

      - name: Report vulnerable dependencies
        run: dotnet list .\FoundersOffice.Windows.slnx package --vulnerable --include-transitive

      - name: Build labeled development MSIX bundle
        shell: pwsh
        run: |
          $buildNumber = [int]$env:GITHUB_RUN_NUMBER
          if ($buildNumber -lt 1 -or $buildNumber -gt 65535) {
            throw "The workflow run number cannot fit in an MSIX version component."
          }
          $packageVersion = "0.1.$buildNumber.0"
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          .\Scripts\New-DevelopmentBundle.ps1 `
            -OutputDirectory (Join-Path $PWD "BundleArtifacts") `
            -PackageVersion $packageVersion `
            -CommitSha $env:GITHUB_SHA `
            -RunUrl $runUrl

      - name: Verify development bundle archive
        run: >-
          python
          .\Scripts\verify-development-bundle.py
          .\BundleArtifacts\FoundersOffice-Windows-x64-DEVELOPMENT.zip

      - name: Publish Windows x64 DEVELOPMENT bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FoundersOffice-Windows-x64-DEVELOPMENT
          path: Apps/Windows/BundleArtifacts/FoundersOffice-Windows-x64-DEVELOPMENT.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
