name: Founder's Office CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founders-office-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report Apple toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Enforce repository privacy boundary
        run: Scripts/check-repository-safety.sh

      - name: Run package and source checks
        run: Scripts/ci-checks.sh

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          archive="${RUNNER_TEMP}/xcodegen.zip"
          install_dir="${RUNNER_TEMP}/xcodegen"
          curl --fail --silent --show-error --location \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "${archive}"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          echo "${install_dir}/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned macOS target
        run: |
          xcodebuild \
            -project FoundersOffice.xcodeproj \
            -scheme FoundersOfficeMac \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData-macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run macOS UI automation
        id: mac-ui-tests
        run: |
          xcodebuild \
            -project FoundersOffice.xcodeproj \
            -scheme FoundersOfficeMac \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData-macOS-UITests" \
            -resultBundlePath "${RUNNER_TEMP}/FoundersOfficeMacUITests.xcresult" \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_ENTITLEMENTS="" \
            test

      - name: Upload failed macOS UI-test result
        if: ${{ failure() && steps.mac-ui-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-ui-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/FoundersOfficeMacUITests.xcresult
          if-no-files-found: error
          retention-days: 14

      - name: Build and verify unsigned macOS customer Release
        run: |
          derived_data="${RUNNER_TEMP}/DerivedData-macOS-Release"
          build_settings="${RUNNER_TEMP}/FoundersOfficeMac-Release-build-settings.txt"
          app_bundle="${derived_data}/Build/Products/Release/Founder's Office.app"

          xcodebuild \
            -project FoundersOffice.xcodeproj \
            -scheme FoundersOfficeMac \
            -configuration Release \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings > "${build_settings}"

          xcodebuild \
            -project FoundersOffice.xcodeproj \
            -scheme FoundersOfficeMac \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "${derived_data}" \
            CODE_SIGNING_ALLOWED=NO \
            build

          Scripts/verify-macos-ci-release.sh "${app_bundle}" "${build_settings}"

      - name: Build unsigned iOS Simulator target
        run: |
          xcodebuild \
            -project FoundersOffice.xcodeproj \
            -scheme FoundersOfficeiOS \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData-iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

  website:
    name: Website safety and build
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Install locked dependencies
        working-directory: Website
        run: npm ci

      - name: Audit production dependencies
        working-directory: Website
        run: |
          npm audit
          npm audit --omit=dev

      - name: Format, lint, and build
        working-directory: Website
        run: |
          npm run format:check
          npm run lint
          npm run build
          npm run test:production-headers
          npm run test:release-policy

  sync_database:
    name: Execute local Supabase RLS and RPC tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run fast credential-free contract validation
        run: python3 Scripts/validate-sync-contracts.py

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.98.2

      - name: Start exact local Supabase Postgres image
        run: |
          test "$(supabase --version)" = "2.98.2"
          supabase db start

          project_id="$(python3 - <<'PY'
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("supabase/config.toml").read_text())
          project_id = config.get("project_id")
          if not isinstance(project_id, str) or not project_id:
              raise SystemExit("supabase/config.toml has no non-empty project_id")
          print(project_id)
          PY
          )"
          database_container="supabase_db_${project_id}"
          if ! database_image="$(docker inspect \
            --format '{{.Config.Image}}' \
            "${database_container}")"; then
            echo "::error::Supabase database container ${database_container} is missing."
            exit 1
          fi
          expected_image="public.ecr.aws/supabase/postgres:15.8.1.085"
          if [[ "${database_image}" != "${expected_image}" ]]; then
            echo "::error::Expected ${expected_image}, found ${database_image}."
            exit 1
          fi

      - name: Apply migrations and execute pgTAP RLS and RPC suite
        run: |
          supabase db reset --local --no-seed
          supabase test db --local supabase/tests

      - name: Stop ephemeral Supabase database
        if: ${{ always() }}
        run: supabase stop --no-backup || true

  report-ci-failure:
    name: File a private CI incident
    needs: [build, website, sync_database]
    if: >-
      ${{ always() &&
          (needs.build.result == 'failure' ||
           needs.website.result == 'failure' ||
           needs.sync_database.result == 'failure') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create or update the run incident
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILD_RESULT: ${{ needs.build.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
          SYNC_DATABASE_RESULT: ${{ needs.sync_database.result }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="ci-run:${RUN_ID}"
          existing="$(gh issue list \
            --repo "${GH_REPO}" \
            --state open \
            --search "\"${marker}\" in:body" \
            --json number \
            --jq '.[0].number // empty')"
          summary="build=${BUILD_RESULT}; website=${WEBSITE_RESULT}; sync-database=${SYNC_DATABASE_RESULT}; attempt=${RUN_ATTEMPT}"
          body="$(printf '%s\n' \
            "<!-- ${marker} -->" \
            "Founder’s Office CI failed on commit \`${COMMIT_SHA}\`." \
            "" \
            "Result: ${summary}" \
            "Run: ${RUN_URL}" \
            "" \
            "This automated incident contains no customer workspace data or build logs. Review the linked run before changing code.")"

          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${GH_REPO}" --body "${body}"
          else
            gh issue create \
              --repo "${GH_REPO}" \
              --title "CI failure: run ${RUN_ID}" \
              --body "${body}"
          fi
