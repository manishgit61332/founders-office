name: Founder's Office Android CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-ci.yml"
      - "Apps/Android/**"
      - "Contracts/**"
      - "Scripts/check-repository-safety.sh"
      - "Scripts/verify-android-development.sh"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
  pull_request:
    paths:
      - ".github/workflows/android-ci.yml"
      - "Apps/Android/**"
      - "Contracts/**"
      - "Scripts/check-repository-safety.sh"
      - "Scripts/verify-android-development.sh"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founders-office-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and debug packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pinned JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install pinned Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Enforce repository privacy boundary
        run: Scripts/check-repository-safety.sh

      - name: Verify Android development build
        run: Scripts/verify-android-development.sh
