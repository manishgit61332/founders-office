name: Product change
description: Propose a scoped product or engineering improvement.
title: "feat: "
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem exists today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ]"
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Privacy, permission, and automation boundary
      description: Identify new data, scopes, external effects, or approval requirements.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or research
