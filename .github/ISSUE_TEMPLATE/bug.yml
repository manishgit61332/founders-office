name: Bug report
description: Report a reproducible product defect without attaching private customer data.
title: "bug: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not attach real tasks, calendars, accounts, communications, photos, tokens, or support bundles."
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic data only.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [macOS, iOS, CloudKit, Calendar, Build and release, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and build
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Include only operation/error domain/code. Remove content and paths.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I verified that this issue contains no private runtime data or credentials.
          required: true
